name: Daily Market Brief

on:
  # Schedule disabled while running locally via self-hosted gateway
  # schedule:
  #   - cron: '35 23 * * 0-4'
  workflow_dispatch: {}

jobs:
  run-daily-brief:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run sectors-daily-brief
        env:
          SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WHATSAPP_TARGET: ${{ secrets.WHATSAPP_TARGET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python src/main.py
          
      - name: Upload execution logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-logs
          path: logs/
          retention-days: 7
